# MSSQL Server baglanti ayarlari.
#
# Kimlik bilgileri bu dosyaya YAZILMAZ. Uygulama once ortam degiskenlerine bakar:
#   DB_URL, DB_USERNAME, DB_PASSWORD
#
# DB_PASSWORD zorunludur; tanimli degilse uygulama acik bir hata ile durur.
# Ayrintili kurulum icin README.md dosyasina bakin.

db.url=jdbc:sqlserver://localhost\\SQLEXPRESS;databaseName=selfworkout;encrypt=false;trustServerCertificate=true;integratedSecurity=false;characterEncoding=UTF-8;useUnicode=true
db.username=sa
db.password=
db.driver=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Baglanti havuzu ayarlari
db.pool.initialSize=5
db.pool.maxActive=20
db.pool.maxIdle=10
db.pool.minIdle=2
